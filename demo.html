<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CapeOS</title>
<style>
:root{--bg:#0d1014;--s1:#161a20;--s2:#1f242c;--tx:#e8ecf1;--mu:#8b95a3;--ln:#2a313b;--acc:#4fd1b5;--sc:1}

#dock .tile{margin:0;position:relative;cursor:pointer;transition:transform .15s}#dock .tile:hover{transform:translateY(-4px)}

#dock .tile.run::after{content:"";position:absolute;bottom:-6px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--acc)}
#wins{position:absolute;inset:0}

@keyframes pop{from{opacity:0;transform:scale(.94)}}
.win.min{display:none}.win.f{border-color:color-mix(in srgb,var(--acc) 55%,var(--ln))}
.tb{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;background:var(--s2);cursor:grab;user-select:none}
.tb b{display:flex;gap:8px;align-items:center;font-weight:600}.tb span{display:flex;gap:2px}.tb button{border:0;background:none;padding:4px 6px}
.wc{flex:1;overflow:auto;position:relative}
.win.max{inset:34px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.sl{left:0!important;top:34px!important;width:50%!important;height:calc(100% - 34px)!important}.win.sr{left:50%!important;top:34px!important;width:50%!important;height:calc(100% - 34px)!important}
.pad{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row small,.mu{color:var(--mu)}.col{display:flex;flex-direction:column;gap:8px}.g{display:grid;gap:10px}
.side{width:170px;flex:none;border-right:1px solid var(--ln);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side button{border:0;background:none;text-align:left;display:flex;gap:8px;align-items:center}.side button.on{background:var(--s2);color:var(--acc)}
.split{display:flex;height:100%}.split>.main{flex:1;overflow:auto;padding:16px;min-width:0}
.tg{width:40px;height:22px;border-radius:11px;padding:0;position:relative;flex:none}.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:.15s}
.tg.on{background:var(--acc);border-color:var(--acc)}.tg.on::after{left:20px;background:#04110e}
.bar{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.card{background:var(--s2);border-radius:10px;padding:12px}
.sw{width:30px;height:30px;border-radius:50%;padding:0}.sw.on{outline:2px solid var(--tx);outline-offset:2px}
.wp{height:60px;border-radius:8px;padding:0}.wp.on{outline:2px solid var(--acc)}
#cc,#nc{position:absolute;top:40px;right:10px;width:330px;max-height:calc(100% - 60px);overflow:auto;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px;z-index:950;animation:pop .15s}
.qt{display:flex;gap:8px;align-items:center;padding:10px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);width:100%;text-align:left}
.qt.on{background:var(--acc);color:#04110e;border-color:var(--acc)}
#toasts{position:absolute;top:42px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:960;width:300px;pointer-events:none}
.nt{background:var(--s1);border:1px solid var(--ln);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;animation:slide .25s;position:relative}
@keyframes slide{from{opacity:0;transform:translateX(30px)}}.nt small{color:var(--mu)}.nt .x{position:absolute;top:6px;right:6px;border:0;background:none;padding:2px}.unr::before{content:"";position:absolute;left:-3px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.ov{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#boot,#off,#sleep{background:#000;color:#fff;z-index:1100}#lock{background-size:cover;z-index:1050;justify-content:space-between;padding:60px 20px 30px;cursor:pointer;color:#fff;text-shadow:0 2px 12px #0008}
#lock .clk{font-size:6em;font-weight:200;letter-spacing:-.04em;line-height:1}
.lg path.d{stroke-dasharray:140;stroke-dashoffset:140;animation:dr 1.6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pb{width:180px;height:3px;background:#333;border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);animation:ld 2.6s linear forwards}@keyframes ld{from{width:0}to{width:100%}}
#prox{background:#000;z-index:1090;color:#555}
#modal{position:absolute;inset:0;background:#0009;z-index:1200;display:grid;place-items:center}
#modal>div{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:22px;width:min(380px,90%);animation:pop .2s}
#ctx{position:absolute;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:4px;z-index:970;min-width:180px}
#ctx button{display:block;width:100%;border:0;background:none;text-align:left}
#sw{position:absolute;inset:0;background:#000a;z-index:940;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px}
#sw .card{width:170px;cursor:pointer;text-align:center}
#panel{position:fixed;top:0;right:0;bottom:0;width:300px;background:#0a0c0f;color:#e8ecf1;border-left:1px solid #2a313b;z-index:9999;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
body.pan #panel{transform:none}
#ptab{position:fixed;right:0;top:50%;z-index:9998;background:#0a0c0f;color:var(--acc);border:1px solid #2a313b;border-right:0;border-radius:10px 0 0 10px;padding:12px 8px;writing-mode:vertical-rl;cursor:pointer;font-weight:700;letter-spacing:.06em;display:flex;gap:6px;align-items:center}

#panel header{padding:14px;border-bottom:1px solid #2a313b}#panel h2{font-size:1.05em;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
#panel .sim{margin-top:8px;font-size:.75em;color:#f2b84b;border:1px dashed #6a5420;border-radius:6px;padding:5px 8px}
#pb{overflow:auto;flex:1;padding:12px 14px;font-size:.88em}
#pb h3{font-size:.85em;color:var(--acc);margin:16px 0 6px;font-weight:600}
#pb .bt{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pb button{font-size:.9em;padding:6px;background:#161a20;border-color:#2a313b;color:#e8ecf1}
#pb .st{display:flex;flex-wrap:wrap;gap:4px}#pb .st span{background:#161a20;border:1px solid #2a313b;border-radius:10px;padding:2px 8px;font-size:.85em;color:#8b95a3}#pb .st span.on{color:var(--acc);border-color:var(--acc)}
.up2{width:100%;height:120px;border-radius:8px}.shots{display:flex;gap:8px;margin:10px 0}.shots i{flex:1;height:90px;border-radius:8px}
.gi{aspect-ratio:4/3;border-radius:8px;cursor:pointer;border:0;padding:0}
@media(max-width:760px){.win{inset:34px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0}#widgets{display:none}#panel{width:min(300px,100%)}body.pan #screen{right:0}.side{width:120px}#dock{max-width:96%;overflow-x:auto}}
/* ===== v2: iOS-style polish ===== */
:root{--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--ln:#ffffff1f;--mu:#98989f;--ease:cubic-bezier(.2,.9,.3,1.15)}
body.light{--bg:#f2f2f7;--s1:#fff;--s2:#f2f2f7;--ln:#0000001a;--mu:#6c6c70}
html,body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
#bar,#dock,.wg,#cc,#nc,.nt,#ctx,#modal>div,.lnc{backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8)}
#bar{background:color-mix(in srgb,var(--s1) 40%,transparent);border:0;font-weight:500}
button{border-radius:12px;border-color:transparent}
.win{border-radius:22px;background:color-mix(in srgb,var(--s1) 86%,transparent);backdrop-filter:blur(40px) saturate(1.6);box-shadow:0 30px 80px #000a,inset 0 0 0 .5px #ffffff30;animation:pop .38s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}}
.tb{background:transparent;height:46px;padding:0 16px;gap:12px}.tb b{flex:1;justify-content:center;font-weight:600;font-size:.95em;margin-right:58px}
.tb span{order:-1;gap:8px}.tb button{width:13px;height:13px;padding:0;border-radius:50%;border:0}.tb button svg{display:none}
.tb [data-w=x]{background:#ff5f57;order:1}.tb [data-w=min]{background:#febc2e;order:2}.tb [data-w=max]{background:#28c840;order:3}.tb [data-w=snap]{background:#0a84ff;order:4}
.tile{width:52px;height:52px;border-radius:24%;font-size:26px;border:0;box-shadow:inset 0 0 0 .5px #ffffff30,0 4px 12px #0004}
.tile svg.i{stroke-width:1.7}
#dock{border-radius:32px;padding:10px 12px;gap:12px;bottom:12px;background:color-mix(in srgb,var(--s1) 38%,transparent);border:1px solid #ffffff26}
#dock .tile{background:linear-gradient(160deg,#48484a,#2c2c2e);color:#fff;transition:transform .22s var(--ease)}
#dock .tile:hover{transform:translateY(-12px) scale(1.3)}#dock .tile:hover+.tile,#dock .tile:has(+.tile:hover){transform:translateY(-5px) scale(1.14)}
body.sm #dock .tile{width:40px;height:40px;font-size:20px}
#icons .ic{color:#fff;text-shadow:0 1px 6px #0009}
.wg{border-radius:24px;padding:16px;background:color-mix(in srgb,var(--s1) 48%,transparent);border:1px solid #ffffff1c}
.wg .big{font-weight:600}
#cc,#nc{border-radius:30px;padding:16px;background:color-mix(in srgb,var(--s1) 55%,transparent);border:1px solid #ffffff22}
.qt{border-radius:20px;padding:14px;border:0;background:color-mix(in srgb,var(--s2) 75%,transparent)}
.nt{border-radius:18px;border:1px solid #ffffff1c;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--s1) 62%,transparent)}
#modal>div{border-radius:26px;background:color-mix(in srgb,var(--s1) 82%,transparent)}
#lock .clk{font-weight:700;font-size:7.5em;letter-spacing:-.05em}
.side button{border-radius:10px;padding:8px 10px}.side button.on{background:var(--acc);color:#04110e;font-weight:600}.side button.on svg{stroke:#04110e}
.card{border-radius:18px}input,textarea,select{border-radius:12px;border-color:transparent}
.ck{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--mu);background:none;flex:none}.ck.on{background:var(--acc);border-color:var(--acc)}
.lnc{position:absolute;inset:0;z-index:940;background:#0008;display:grid;place-items:center;animation:pop .3s var(--ease)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:24px;max-width:620px;justify-content:center;padding:30px}.lgrid .ic{color:#fff;width:92px}
.eq{display:flex;gap:3px;align-items:flex-end;height:24px}.eq i{width:4px;background:var(--acc);border-radius:2px;animation:eq .8s infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}@keyframes eq{from{height:4px}to{height:24px}}
.term{background:#0b0d10;color:#c9f5e9;font:13px ui-monospace,Menlo,monospace;height:100%;overflow:auto;padding:12px}.term input{background:none;border:0;padding:0;flex:1;color:inherit;font:inherit}
/* ===== welcome screen ===== */
#welcome{position:absolute;inset:0;z-index:1070;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 20px;text-align:center;color:#fff;overflow:auto;animation:wfade .9s ease both}

#welcome .wf svg{font-size:22px;color:var(--acc);margin-bottom:8px}#welcome .wf b{display:block;margin-bottom:4px}#welcome .wf span{font-size:.88em;opacity:.8;line-height:1.4;display:block}
#welcome .wl{animation:wup .8s var(--ease) both}
#welcome small{opacity:.7;max-width:460px}
/* ===== desktop icons + finder-style files ===== */

.fr.dov,.side button.dov{outline:2px solid var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px}.fi{width:96px;text-align:center;padding:8px 4px;border-radius:12px;font-size:.85em;cursor:default;user-select:none}.fi .tile{margin:0 auto 4px}.fi span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{background:none;border:0;padding:2px 4px;color:var(--mu)}.crumb:last-child{color:var(--tx)}
/* ===== CapeBrowser ===== */
.cbt{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;flex:none}

</style></head><body>
<div id="screen"><div id="desk"></div><div id="widgets"></div><div id="icons"></div><div id="wins"></div>
<div id="bar"></div><div id="dock"></div><div id="toasts"></div>
<div id="lock" class="ov" hidden></div><div id="boot" class="ov" hidden></div><div id="off" class="ov" hidden></div><div id="sleep" class="ov" hidden></div><div id="prox" class="ov" hidden>Proximity sensor covered — display off</div></div>
<button id="ptab" data-a="panel">DEMO ACTIONS</button>

APPS.cbrowser={t:"CapeBrowser",i:"compass",w:920,h:580,live:1,r(c){
if(c._b){if(online()!==c._b.on){c._b.on=online();c._b.draw()}return}
const b=c._b={tabs:[],a:null,on:online(),n:0},cur=()=>b.tabs.find(t=>t.id===b.a),host=u=>{try{return new URL(u).hostname}catch(e){return u}};
const TT={"cape://home":"New tab","cape://history":"History","cape://bookmarks":"Bookmarks","cape://privacy":"Privacy report","cape://about":"About"};
const title=u=>TT[u]||(u.startsWith("cape://")?"Not found":host(u));
const parse=v=>{v=v.trim();if(!v)return null;if(/^(cape|https?):\/\//i.test(v))return v;if(!/\s/.test(v)&&/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v))return"https://"+v;return"https://en.wikipedia.org/wiki/Special:Search?search="+encodeURIComponent(v)};

const ext=document.createElement("a"),outside=u=>{ext.href=u;ext.target="_blank";ext.rel="noopener noreferrer";ext.click()};
const page=u=>{if(u==="cape://home")return`<div style="text-align:center;padding:36px 20px"><div>${LOGO(64)}</div><h1 style="font-size:2.4em;font-weight:700;letter-spacing:-.04em;margin-top:8px">CapeBrowser</h1><p class="mu" style="margin-top:4px">Private by default. ${b.n} trackers blocked this session.</p><input id="hs" placeholder="Search or enter address" style="max-width:440px;margin:18px auto 26px;display:block;border-radius:999px;padding:11px 18px"><div class="g" style="grid-template-columns:repeat(auto-fill,104px);justify-content:center">${[...S.bm.map(x=>[x.t,x.u]),["History","cape://history"],["Privacy report","cape://privacy"]].map(x=>`<button data-go="${esc(x[1])}" style="padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:20px">${I(x[1].startsWith("cape")?"shield":"globe",22)}<small>${esc(x[0])}</small></button>`).join("")}</div></div>`;
if(u==="cape://history")return`<div class="pad"><div class="row" style="border:0"><h2>History</h2><button data-clr>Clear history</button></div>${S.hist.map(x=>`<div class="row" data-go="${esc(x.u)}" style="cursor:pointer"><span>${esc(host(x.u))}<br><small class="mu">${esc(x.u)}</small></span><small class="mu">${time(new Date(x.t))}</small></div>`).join("")||'<p class="mu pad">No history yet. Private tabs are never saved.</p>'}</div>`;
if(u==="cape://bookmarks")return`<div class="pad"><h2>Bookmarks</h2>${S.bm.map((x,i)=>`<div class="row"><span data-go="${esc(x.u)}" style="cursor:pointer">${esc(x.t)}<br><small class="mu">${esc(x.u)}</small></span><button data-rm="${i}">Remove</button></div>`).join("")||'<p class="mu pad">Use the star in the address bar to save a page.</p>'}</div>`;
if(u==="cape://privacy")return`<div class="pad"><h2>Privacy report</h2><p class="mu" style="margin:4px 0 12px">Simulated protections for the demo.</p>${rw("Trackers blocked this session",b.n)}${rw("Third-party cookies","Blocked")}${rw("Referrer sent to sites","Never")}${rw("Fingerprinting protection","On")}${rw("History","Saved on this device only")}${rw("Private tabs","Nothing is saved")}</div>`;
if(u==="cape://about")return`<div class="pad" style="text-align:center;padding-top:50px">${LOGO(56)}<h2 style="margin-top:8px">CapeBrowser 1.0</h2><p class="mu" style="max-width:420px;margin:8px auto">The browser built into CapeOS. Web pages load in a sandbox. Searches go to Wikipedia in this demo. Some sites refuse to appear inside other pages.</p></div>`;
return`<div class="pad" style="text-align:center;padding-top:60px"><h2>Page not found</h2><p class="mu">${esc(u)} doesn't exist.</p></div>`};
const draw=b.draw=()=>{const t=cur(),u=t.h[t.i],isE=!u.startsWith("cape://"),bk=S.bm.some(x=>x.u===u),off=isE&&!online();
c.innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div class="cbt">${b.tabs.map(x=>`<button class="ctab ${x.id===b.a?"on":""}" data-t="${x.id}">${x.priv?I("lock",13):""}<span class="t">${esc(title(x.h[x.i]))}</span><i data-x="${x.id}">×</i></button>`).join("")}<button data-nt style="padding:4px 10px;background:none">${I("plus",14)}</button></div><div class="cbb ${t.priv?"priv":""}"><button data-b ${t.i?"":"disabled"}>${I("left",16)}</button><button data-f ${t.i<t.h.length-1?"":"disabled"}>${I("right",16)}</button><button data-r>${I("rld",15)}</button><input id="ad" value="${u==="cape://home"?"":esc(u)}" placeholder="${t.priv?"Private tab: search or enter address":"Search or enter address"}" spellcheck="false"><button data-s title="${bk?"Remove bookmark":"Bookmark this page"}" style="${bk?"color:var(--acc)":""}"><svg class="i" viewBox="0 0 24 24" style="fill:${bk?"currentColor":"none"}"><path d="${P.star}"/></svg></button><button data-sh title="Trackers blocked">${I("shield",16)} <small>${b.n}</small></button><button data-m>${I("dots",16)}</button></div>${S.bm.length?`<div class="cbm">${S.bm.slice(0,8).map(x=>`<button data-go="${esc(x.u)}">${esc(x.t)}</button>`).join("")}</div>`:""}<div id="cbp" style="flex:1;min-height:0;overflow:auto;position:relative"></div></div>`;
const box=c.querySelector("#cbp");
if(off)box.innerHTML=`<div style="text-align:center;padding-top:70px"><div style="color:var(--mu)">${I("wifi",44)}</div><h2 style="margin:10px 0">You are offline</h2><p class="mu">${S.air?"Airplane mode is on.":!S.wifi?"Wi-Fi is off.":"Wi-Fi is connected but there is no internet."}</p><button class="p" data-r style="margin-top:14px">Try again</button></div>`;
else if(isE){const h=document.createElement("div");h.className="cbh";h.innerHTML=`<span>If this page stays blank, the site blocks embedding.</span><button style="padding:2px 10px">Open in your browser</button>`;h.lastChild.onclick=()=>outside(u);if(!t.el){const f=document.createElement("iframe");f.src=u;f.setAttribute("sandbox","allow-scripts allow-forms allow-popups allow-same-origin");f.referrerPolicy="no-referrer";f.style.cssText="width:100%;height:calc(100% - 32px);border:0;background:#fff;display:block";t.el=f}box.append(h,t.el)}
else box.innerHTML=page(u);
const q=s=>c.querySelectorAll(s);
q("[data-t]").forEach(x=>x.onclick=e=>{if(e.target.closest("[data-x]"))return;b.a=+x.dataset.t||x.dataset.t;b.a=b.tabs.find(y=>String(y.id)===x.dataset.t).id;draw()});
q("[data-x]").forEach(x=>x.onclick=()=>{b.tabs=b.tabs.filter(y=>String(y.id)!==x.dataset.x);if(!b.tabs.length)return newTab();if(!b.tabs.find(y=>y.id===b.a))b.a=b.tabs[b.tabs.length-1].id;draw()});
c.querySelector("[data-nt]").onclick=()=>newTab();
c.querySelector("[data-b]").onclick=()=>{t.i--;t.el=null;draw()};c.querySelector("[data-f]").onclick=()=>{t.i++;t.el=null;draw()};q("[data-r]").forEach(x=>x.onclick=()=>{t.el=null;draw()});
const ad=c.querySelector("#ad");ad.onfocus=()=>ad.select();ad.onkeydown=e=>{if(e.key==="Enter")nav(parse(ad.value))};
c.querySelector("[data-s]").onclick=()=>{if(!isE)return notify("CapeBrowser","Can't bookmark this page","Only web pages can be bookmarked.");if(bk)S.bm=S.bm.filter(x=>x.u!==u);else S.bm.push({t:host(u),u});save();draw()};
c.querySelector("[data-sh]").onclick=()=>nav("cape://privacy");
c.querySelector("[data-m]").onclick=e=>{e.stopPropagation();ctxMenu(e.clientX-140,e.clientY+14,[["New tab",()=>newTab()],["New private tab",()=>newTab("cape://home",1)],["History",()=>nav("cape://history")],["Bookmarks",()=>nav("cape://bookmarks")],["Privacy report",()=>nav("cape://privacy")],["About CapeBrowser",()=>nav("cape://about")]])};
q("[data-go]").forEach(x=>x.onclick=()=>nav(x.dataset.go));const hs=c.querySelector("#hs");if(hs){hs.onkeydown=e=>{if(e.key==="Enter")nav(parse(hs.value))};setTimeout(()=>hs.focus(),30)}
const cl=c.querySelector("[data-clr]");if(cl)cl.onclick=()=>{S.hist=[];save();draw()};q("[data-rm]").forEach(x=>x.onclick=()=>{S.bm.splice(+x.dataset.rm,1);save();draw()})};
newTab()}};
