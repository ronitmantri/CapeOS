<style>
/* ========== 1. Tokens ========== */
:root{--bg:#000;--s0:#0f1418;--s1:#141a1f;--s2:#1c242b;--s3:#26303a;--ln:#ffffff14;--ln2:#ffffff26;--tx:#eef2f5;--mu:#8d98a3;--acc:#5b8def;--r:14px;--sc:1;--pad:calc(clamp(10px,2.2vw,28px) + clamp(8px,1.1vw,14px));--font:"Inter","SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.3,1)}

/* ========== 2. Base ========== */

textarea{resize:none}
input[type=range]{-webkit-appearance:none;appearance:none;padding:0;height:4px;border-radius:2px;background:var(--s3);border:0}

.tg.on{background:var(--acc);border-color:var(--acc)}.tg.on::after{left:20px;background:#fff}

.wp{height:60px;border-radius:9px;padding:0}.wp.on{outline:2px solid var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.lg path.d{stroke-dasharray:140;stroke-dashoffset:140;animation:dr 1.6s forwards}@keyframes dr{to{stroke-dashoffset:0}}

/* ========== 3. Screen framing (bezel) ========== */
#stage{position:fixed;inset:0;display:grid;place-items:center;padding:clamp(10px,2.2vw,28px);transition:padding-right .3s}

#screen{position:relative;overflow:hidden;border-radius:clamp(6px,.9vw,10px);background:var(--bg);aspect-ratio:16/10;width:min(calc(100vw - var(--sw,0px) - 2*var(--pad)),calc((100vh - 2*var(--pad))*1.6));transition:width .3s}

.bc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;line-height:1.05}.bc small{color:var(--mu);font-size:.75em}
.chip{background:none;border:0;display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px}.chip:hover{background:var(--s2)}.chip.rec{color:#ff5f57;font-weight:700}

.di.sel{background:#ffffff2e;box-shadow:inset 0 0 0 1px #ffffff55}.di .tile{--s:60px;margin:0 auto 6px;display:grid}.di span.l{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s0);border:1px solid var(--ln2);border-radius:22px;z-index:800;box-shadow:0 12px 30px #0006;max-width:calc(100% - 16px)}
.dk{background:none;border:0;padding:0;border-radius:12px;position:relative;display:grid;transition:transform .18s}.dk:hover:not(:disabled){background:none;transform:translateY(-4px)}
.dk.run::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tx)}
.dk.lc{width:44px;height:44px;background:var(--s2);border:1px solid var(--ln2);place-items:center;font-size:20px}
.sep{width:1px;height:30px;background:var(--ln2);flex:none}
body.sm .dk .tile{--s:36px}body.sm .dk.lc{width:38px;height:38px}
.tile{--s:44px;width:var(--s);height:var(--s);border-radius:24%;display:inline-grid;place-items:center;font-size:calc(var(--s)*.5);color:#fff;flex:none;background:linear-gradient(160deg,#6b7485,#4a5260);box-shadow:inset 0 0 0 1px #ffffff2e,inset 0 1px 0 #ffffff30,0 3px 8px #0004}
.tile[data-app=files]{background:linear-gradient(160deg,#4a74d9,#6a95f0)}.tile[data-app=cbrowser]{background:linear-gradient(160deg,#2f9c9c,#53c0b8)}
.tile[data-app=notes]{background:linear-gradient(160deg,#b88a4a,#dcb26e)}.tile[data-app=settings]{background:linear-gradient(160deg,#5f6878,#8b95a6)}
.tile[data-app=store]{background:linear-gradient(160deg,#4e6de0,#7a68e0)}.tile[data-app=calc]{background:linear-gradient(160deg,#d08a3a,#e8a85a)}
.tile[data-app=gallery]{background:linear-gradient(160deg,#c85a7a,#e88a6a)}.tile[data-app=cal]{background:linear-gradient(160deg,#c9534f,#e8776f)}
.tile[data-app=music]{background:linear-gradient(160deg,#b85560,#dc7c80)}.tile[data-app=clock]{background:linear-gradient(160deg,#3a424d,#59626f)}
.tile[data-app=weather]{background:linear-gradient(160deg,#3d86c4,#6bb5e6)}.tile[data-app=sysinfo]{background:linear-gradient(160deg,#5d6672,#7d8794)}
.tile[data-app=privacy]{background:linear-gradient(160deg,#3e9b6a,#63c28f)}.tile[data-app=todo]{background:linear-gradient(160deg,#d49a3c,#ecc065)}
.tile[data-app=term]{background:linear-gradient(160deg,#1d2329,#323b44)}.tile[data-app=games]{background:linear-gradient(160deg,#8b64c8,#6a6fe0)}
.tile[data-app=paint]{background:linear-gradient(160deg,#c8506a,#e8855a)}.tile[data-app=focus]{background:linear-gradient(160deg,#d0673a,#e8885a)}
.tile[data-app=trash]{background:linear-gradient(160deg,#4b5360,#2f353d)}.tile.fol{background:linear-gradient(160deg,#4a74d9,#6a95f0)}.tile.fil{background:linear-gradient(160deg,#e6e9ee,#aab2bd);color:#39414b}
/* ========== 6. Windows ========== */

.win{position:absolute;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--ln2);border-radius:var(--r);box-shadow:0 10px 30px #0006;overflow:hidden;pointer-events:auto;animation:pop .22s var(--ease)}
.win.f{box-shadow:0 24px 60px #000a,0 2px 8px #0006}.win.min{display:none}

.win.sl{left:0!important;top:36px!important;width:50%!important;height:calc(100% - 36px - 78px)!important}.win.sr{left:50%!important;top:36px!important;width:50%!important;height:calc(100% - 36px - 78px)!important}
.win.fsb{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0;z-index:1000!important}.win.fsb>.tb{display:none}

.tb b{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:600;font-size:.95em;min-width:0}.tb b .tile{--s:20px;border-radius:6px;box-shadow:none}
.tr{display:flex;justify-content:flex-end}.tr button{background:none;border:0;padding:4px;color:var(--mu)}.tr button:hover{color:var(--tx)}
.wc{flex:1;min-height:0;overflow:auto;position:relative}
.split{display:flex;height:100%}.split>.main{flex:1;overflow:auto;padding:16px;min-width:0}
.side{width:176px;flex:none;border-right:1px solid var(--ln);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--s0)}
.side button{border:0;background:none;text-align:left;display:flex;gap:9px;align-items:center;border-radius:8px;padding:7px 10px}.side button:hover{background:var(--s2)}
.side button.on{background:var(--acc);color:#fff;font-weight:600}
/* ========== 7. Overlays: menus, start, control center, notifications ========== */
#ctx{position:absolute;background:var(--s2);border:1px solid var(--ln2);border-radius:10px;padding:4px;z-index:970;min-width:190px;box-shadow:0 12px 30px #0008}
#ctx button{display:block;width:100%;border:0;background:none;text-align:left;border-radius:6px;padding:7px 12px;white-space:nowrap}#ctx button:hover{background:var(--acc);color:#fff}
#modal{position:absolute;inset:0;background:#0008;z-index:1200;display:grid;place-items:center}

#start{position:absolute;left:12px;bottom:84px;width:min(480px,calc(100% - 24px));background:var(--s1);border:1px solid var(--ln2);border-radius:18px;z-index:930;box-shadow:0 24px 60px #000a;animation:pop .2s var(--ease);overflow:hidden}
#start .sr{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln);color:var(--mu)}#start .sr input{background:none;border:0;padding:0;font-size:1.05em;flex:1;outline:none}

#start .sb{padding:16px 18px;max-height:360px;overflow:auto}.sh{display:flex;justify-content:space-between;margin-bottom:14px}.sh button{color:var(--acc);background:none;border:0;padding:0;font-size:.85em;font-weight:600}.sh button:hover{background:none;text-decoration:underline}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:14px 6px;margin-bottom:18px}.sg button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.82em;padding:4px}.sg .tile{--s:48px}
.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:14px;padding:12px 14px}.qa .qi{width:38px;height:38px;border-radius:10px;background:var(--s3);color:var(--acc);display:grid;place-items:center;flex:none}.qa small{display:block;color:var(--mu)}
.rs{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px}.rs:hover,.rs.on{background:var(--s3)}.rs .tile{--s:30px}
#start .su{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--ln);background:var(--s0)}#start .su b{flex:1}
.av{width:38px;height:38px;border-radius:50%;background:#243248;display:grid;place-items:center;font-weight:700;font-size:.85em}
#cc,#nc{position:absolute;top:42px;right:10px;width:340px;max-height:calc(100% - 60px);overflow:auto;background:var(--s1);border:1px solid var(--ln2);border-radius:18px;padding:16px;z-index:950;animation:pop .18s var(--ease);box-shadow:0 24px 60px #000a}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.ch small{letter-spacing:.12em;color:var(--mu);font-size:.7em}.ch h3{font-size:1.5em}

.ct{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;text-align:left}.ct b{display:block;font-size:.95em}.ct small{color:var(--mu)}

.cm{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.cm>span:nth-child(2){flex:1}.cm b{display:block}.cm small{color:var(--mu)}
.art2{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,#3b5b9d,#a8566f);display:grid;place-items:center;font-size:.7em;font-weight:700;flex:none}
.pl{width:38px;height:38px;border-radius:50%;background:#f4f6f8;color:#12161a;border:0;display:grid;place-items:center;padding:0;flex:none}.pl:hover:not(:disabled){background:#fff}
#toasts{position:absolute;top:44px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:960;width:300px;pointer-events:none}
.nt{background:var(--s1);border:1px solid var(--ln2);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;animation:slide .25s var(--ease);position:relative;box-shadow:0 10px 24px #0007}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}.nt small{color:var(--mu)}.nt .x{position:absolute;top:6px;right:6px;border:0;background:none;padding:2px}.unr::before{content:"";position:absolute;left:-3px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--acc)}
#sw{position:absolute;inset:0;background:#000a;z-index:940;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px;color:#fff}#sw .card{width:170px;cursor:pointer;text-align:center;color:var(--tx)}
/* ========== 8. Power, lock, welcome ========== */
.ov{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#boot,#off,#sleep,#prox{background:#000;color:#fff;z-index:1100}#prox{z-index:1090;color:#555}
#lock{background-size:cover;z-index:1050;justify-content:space-between;padding:56px 20px 28px;cursor:pointer;color:#fff;text-shadow:0 2px 12px #0008}#lock .clk{font-size:6.5em;font-weight:600;letter-spacing:-.04em;line-height:1}
.pb{width:180px;height:3px;background:#333;border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);animation:ld 2.6s linear forwards}@keyframes ld{from{width:0}to{width:100%}}
#welcome{position:absolute;inset:0;z-index:1070;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center;color:#fff;overflow:auto;animation:wfade .9s ease both}
@keyframes wfade{from{opacity:0}}#welcome.out{opacity:0;transform:scale(1.03);transition:.5s}#welcome::before{content:"";position:absolute;inset:0;background:#0007;z-index:-1}
#welcome .wm{font-weight:700;letter-spacing:.42em;margin-right:-.42em}#welcome h1{font-size:clamp(2em,5vw,3.4em);letter-spacing:-.04em;line-height:1.05;min-height:1.1em;transition:opacity .4s}
#welcome p{max-width:520px;line-height:1.5;opacity:.9}#welcome small{opacity:.7;max-width:460px}
#welcome .wf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:640px;width:100%}
#welcome .wf div{background:#141a1fcc;border:1px solid #ffffff26;border-radius:16px;padding:14px;text-align:left;animation:wup .7s var(--ease) both}#welcome .wf div:nth-child(2){animation-delay:.12s}#welcome .wf div:nth-child(3){animation-delay:.24s}
@keyframes wup{from{opacity:0;transform:translateY(16px)}}#welcome .wf svg{font-size:22px;color:var(--acc);margin-bottom:8px}#welcome .wf b{display:block;margin-bottom:4px}#welcome .wf span{font-size:.88em;opacity:.8;display:block}.wl{animation:wup .8s var(--ease) both}
/* ========== 9. Demo Actions panel ========== */
#panel{position:fixed;top:0;right:0;bottom:0;width:300px;background:#0a0c0f;color:#e8ecf1;border-left:1px solid #2a313b;z-index:9999;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}body.pan #panel{transform:none}
